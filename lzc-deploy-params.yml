params:
  - id: zocr.token
    type: secret
    name: 认证密钥
    description: 填空所有能访问到懒猫微服的人都能访问你的服务，默认会生成随机32位密码。
    optional: true
    default_value: $random(len=32)
    hidden: false
  - id: zocr.workers
    type: string
    name: 进程
    description: uvicorn工作进程数，大量图片或请求时可以调整，不要超过CPU核心数
    optional: false
    default_value: "1"
    hidden: false
  - id: zocr.model_version
    type: string
    name: OCR模型版本
    description: 可选tiny/small/medium，越大的模型效果也好，需要的资源也越多。
    optional: false
    default_value: small
    hidden: false
  - id: zocr.max_file_size
    type: string
    name: 最大文件大小
    description: 单位bytes，默认10MB，一般的图片也不会超过这个大小。
    optional: false
    default_value: "10485760"
    hidden: false

locales: # map 国际化相关
  en-US:
    zocr.token:
      name: Authentication token
      description: If left empty, anyone who can access your LazyCat box can use this service. A random 32-character password is generated by default.
    zocr.workers:
      name: Workers
      description: Number of uvicorn worker processes. Increase this for many images or requests, but do not exceed the number of CPU cores.
    zocr.model_version:
      name: OCR model version
      description: Available options are tiny, small, and medium. Larger models usually provide better results but require more resources.
    zocr.max_file_size:
      name: Maximum file size
      description: In bytes. The default is 10 MB, which is enough for most images.
